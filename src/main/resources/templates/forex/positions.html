<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Nyitott Pozíciók (Poz)')}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="main-content container py-5">
    <div class="card card-custom p-4">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div class="d-flex align-items-center">
                <div class="p-3 rounded-3 bg-primary bg-opacity-25 text-info me-3">
                    <i class="bi bi-list-columns-reverse fs-2"></i>
                </div>
                <div>
                    <h3 class="text-white mb-0">Nyitott Pozíciók Listája (Poz)</h3>
                    <p class="text-secondary small mb-0">Aktuálisan nyitott devizapiaci kötések és lebegő eredmény</p>
                </div>
            </div>
            <div class="d-flex gap-2">
                <a th:href="@{/forex/open-position}" class="btn btn-success btn-sm text-dark fw-bold">
                    <i class="bi bi-plus-lg me-1"></i>Új pozíció nyitása
                </a>
                <a th:href="@{/positions}" target="_blank" class="btn btn-outline-info btn-sm">
                    <i class="bi bi-terminal me-1"></i>Nyers /positions API
                </a>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-custom table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>Trade ID</th>
                        <th>Instrumentum</th>
                        <th>Nyitás időpontja</th>
                        <th>Irány / Mennyiség</th>
                        <th class="text-end">Nyitó ár</th>
                        <th class="text-end">Nem realizált P&amp;L</th>
                        <th class="text-center">Művelet</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="trade : ${trades}">
                        <td class="font-monospace fw-bold text-info" th:text="${trade.id}"></td>
                        <td class="fw-semibold text-light" th:text="${trade.instrument}"></td>
                        <td class="small text-secondary" th:text="${trade.openTime}"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${trade.currentUnits >= 0 ? 'badge-soft-success' : 'badge-soft-danger'}"
                                  th:text="${trade.currentUnits >= 0 ? 'LONG: +' + trade.currentUnits : 'SHORT: ' + trade.currentUnits}">
                            </span>
                        </td>
                        <td class="text-end font-monospace text-light" th:text="${#numbers.formatDecimal(trade.price, 1, 'COMMA', 5, 'POINT')}"></td>
                        <td class="text-end font-monospace fw-bold"
                            th:classappend="${trade.unrealizedPL >= 0 ? 'text-success' : 'text-danger'}"
                            th:text="${(trade.unrealizedPL >= 0 ? '+' : '') + #numbers.formatDecimal(trade.unrealizedPL, 1, 'COMMA', 2, 'POINT')} + ' EUR'">
                        </td>
                        <td class="text-center">
                            <form th:action="@{/forex/close-position}" method="post" class="d-inline">
                                <input type="hidden" name="tradeId" th:value="${trade.id}">
                                <button type="submit" class="btn btn-outline-danger btn-sm" onclick="return confirm('Biztosan lezárod ezt a pozíciót?')">
                                    <i class="bi bi-x-circle me-1"></i>Zárás
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(trades)}">
                        <td colspan="7" class="text-center text-secondary py-4">
                            <i class="bi bi-inbox me-2"></i>Jelenleg nincs nyitott piaci pozíciód.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>

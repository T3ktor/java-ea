<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Pozíció Zárása (Zár)')}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="main-content container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card card-custom p-4">
                <div class="card-body">
                    <div class="d-flex align-items-center mb-4">
                        <div class="p-3 rounded-3 bg-danger bg-opacity-25 text-danger me-3">
                            <i class="bi bi-x-circle fs-2"></i>
                        </div>
                        <div>
                            <h3 class="text-white mb-0">Pozíció Zárása Piaci Áron (Zár)</h3>
                            <p class="text-secondary small mb-0">Add meg a lezárandó tranzakció Trade ID azonosítóját</p>
                        </div>
                    </div>

                    <form th:action="@{/forex/close-position}" th:object="${param}" method="post">
                        <div class="mb-4">
                            <label for="tradeId" class="form-label text-secondary fw-semibold">Trade ID</label>
                            <input type="number" id="tradeId" class="form-control form-control-lg font-monospace" placeholder="pl. 931 vagy 101" th:field="*{tradeId}" required>
                            <div class="form-text text-secondary small">
                                Nyitott pozíciók azonosítói közül választhatsz:
                                <span th:each="trade : ${openTrades}" class="badge bg-secondary me-1" th:text="'#' + ${trade.id} + ' (' + ${trade.instrument} + ')'"></span>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-danger w-100 fw-bold py-2">
                            <i class="bi bi-x-octagon me-1"></i>Pozíció azonnali lezárása
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>

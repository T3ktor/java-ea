<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Forex Pozíció Nyitása (Nyit)')}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="main-content container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card card-custom p-4">
                <div class="card-body">
                    <div class="d-flex align-items-center mb-4">
                        <div class="p-3 rounded-3 bg-success bg-opacity-25 text-success me-3">
                            <i class="bi bi-box-arrow-in-right fs-2"></i>
                        </div>
                        <div>
                            <h3 class="text-white mb-0">Piaci Pozíció Nyitása (Nyit)</h3>
                            <p class="text-secondary small mb-0">Pozitív érték: Long (Vétel) &bull; Negatív érték: Short (Eladás)</p>
                        </div>
                    </div>

                    <form th:action="@{/forex/open-position}" th:object="${param}" method="post">
                        <div class="mb-3">
                            <label for="instrument" class="form-label text-secondary fw-semibold">Instrumentum</label>
                            <select class="form-select" id="instrument" th:field="*{instrument}">
                                <option value="EUR_USD">EUR_USD</option>
                                <option value="USD_CHF">USD_CHF</option>
                                <option value="GBP_USD">GBP_USD</option>
                                <option value="USD_JPY">USD_JPY</option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <label for="quantity" class="form-label text-secondary fw-semibold">Mennyiség (Units): [-100 .. 100]</label>
                            <input type="number" id="quantity" class="form-control form-control-lg font-monospace" min="-100" max="100" th:field="*{units}" required>
                            <div class="form-text text-secondary small">
                                <span class="text-success"><i class="bi bi-arrow-up-circle me-1"></i>Pozitív szám = Long pozíció nyitása piaci áron</span><br>
                                <span class="text-danger"><i class="bi bi-arrow-down-circle me-1"></i>Negatív szám = Short pozíció nyitása piaci áron</span>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success w-100 text-dark fw-bold py-2">
                            <i class="bi bi-check-circle me-1"></i>Pozíció megnyitása piaci áron
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>

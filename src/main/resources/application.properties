spring.application.name=tradepulse
server.port=8080

# H2 perzisztens adatbázis (helyi fájlba mentve a feladatkiírás szerint)
spring.datasource.url=jdbc:h2:file:./data/tradepulse;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate beállítások
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 webes kezelőkonzol engedélyezése
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf beállítások
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

